    <style>
        /* --- GENERAL SETTINGS --- */
        /* --- NAVIGATION STYLES --- */
        .screenshot-gradient {
            background: linear-gradient(90deg, #0056b3 0%, #2ac8eb 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            -webkit-text-fill-color: transparent;
            width: fit-content;
        }

        .nav-item {
            text-decoration: none;
            color: rgb(29, 84, 133);
            font-weight: 600;
            font-size: 0.95rem;
            margin-left: 2rem;
            padding-bottom: 4px;
            transition: all 0.2s ease-in-out;
            border-bottom: 2px solid transparent;
        }

        .nav-item:hover {
            background: linear-gradient(90deg, #0056b3 0%, #2ac8eb 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            -webkit-text-fill-color: transparent;
        }

        .nav-item.active {
            color: #0056b3;
            border-bottom: 2px solid #0056b3;
        }

        /* --- HERO SECTION LAYOUT (Restored) --- */
        .hero {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            padding: 0 10%;
            gap: 5rem; /* Space between text and image */
            position: relative;
            z-index: 2;
        }

        .hero-text {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        /* Restored Font Sizes and Styling */
        .hero h1 {
            font-size: 5rem;
            font-weight: 700;
            line-height: 1.1;
            margin-bottom: 1.5rem;
        }

        /* --- FADED IMAGE STYLE (Kept from new changes) --- */
        .hero-image {
            flex-shrink: 0;
            width: 450px;
            height: 450px;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: fadeIn 1.2s ease-out;
        }

        .hero-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 20px;
            
            /* The Fade Effect (Sides & Corners) */
            -webkit-mask-image: radial-gradient(ellipse at center, black 40%, transparent 70%);
            mask-image: radial-gradient(ellipse at center, black 40%, transparent 70%);
            
            opacity: 0.95;
            transition: transform 0.3s ease;
        }

        .hero-image img:hover {
            transform: scale(1.02);
            opacity: 1;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Mobile Responsive */
        @media (max-width: 900px) {
            .hero {
                flex-direction: column-reverse;
                text-align: center;
                gap: 2rem;
                padding-top: 100px;
            }
            .hero h1 {
                font-size: 3.5rem;
            }
            .hero-image {
                width: 300px;
                height: 300px;
            }
        }
    </style>
</head>
